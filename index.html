<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    div {
      width: 900px;
      height: 600px;
      background-color: rgb(210, 12, 12);
    }

    div div>p {
      width: 200px;
      height: 200px;
      background-color: white;
      font-size: 70px;
      border-radius: 50%;
      text-align: center;
      position: relative;
      left: 350px;
      bottom: 150px;

    }

    .flag div {
      width: 900px;
      height: 200px;
      background-color: rgb(0, 0, 114);
      position: absolute;
      top: 165px;

    }

    .flag>p {
      color: white;
      position: relative;
      left: 370px;
      font-size: 50px;

    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
